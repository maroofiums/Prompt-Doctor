[project]
name = "prompt-doctor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maroofiums", email = "maroof96965@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
    "transformers>=5.21.0",
]

[project.scripts]
prompt-doctor = "prompt_doctor:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
